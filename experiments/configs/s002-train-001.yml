# REINFORCE training run — scenario-002 (multi-service, 5 targets)
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s002_attacker
max_steps: 30
model: moonshotai/Kimi-K2.6
timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 10

# --- Seeds ---
seed_python: 0
seed_torch: 0

# --- Policy ---
hidden_dim: 128
num_layers: 1

# --- Training ---
num_episodes: 50
gamma: 0.99
learning_rate: 0.001
use_baseline: true
grad_clip: 1.0

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results
