# Smoke test — z-ai/glm-5.2 via OpenRouter — tool-call compliance check on scenario-003
# DeepInfra's GLM-5.2 endpoint wasn't working (2026-08-15); routed through OpenRouter instead.
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 10
model: z-ai/glm-5.2
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 5

# --- Seeds ---
seed_python: 42
seed_torch: 42

# --- Policy ---
hidden_dim: 128
num_layers: 1

# --- Training ---
num_episodes: 1
gamma: 0.99
learning_rate: 0.001
use_baseline: false
grad_clip: 1.0

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results