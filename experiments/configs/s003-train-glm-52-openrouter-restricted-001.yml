# Restricted training run — zai-org/GLM-5.2 via OpenRouter, scenario-003.
# Not a confirmatory run: 10 episodes is well short of the ~25-50 episodes past
# s003 runs needed before entropy/reward showed any real movement. Purpose here
# is to check (a) a full recon->brute-force->connect chain completes and gets
# credited correctly for this model via OpenRouter, and (b) real per-step timing
# to budget a full run, before committing to one. max_steps=100 matches what
# real (pre-ADR-014) s003 training configs already used, e.g.
# s003-train-minimax-m27-conditioned-005.yml.
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 100
model: z-ai/glm-5.2
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 5

# --- Seeds ---
seed_python: 42
seed_torch: 42

# --- Policy ---
hidden_dim: 128
num_layers: 1

# --- Training ---
num_episodes: 10
gamma: 0.99
learning_rate: 0.001
use_baseline: true
grad_clip: 1.0

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results