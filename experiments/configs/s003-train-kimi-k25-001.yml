# REINFORCE training run — scenario-003 (mixed-target: 5 exploitable, 5 hardened, 2 dead)
# Model: moonshotai/Kimi-K2.5
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 80
model: moonshotai/Kimi-K2.5
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 5

# --- Seeds ---
seed_python: 0
seed_torch: 0

# --- Policy ---
hidden_dim: 128
num_layers: 1

# --- Training ---
num_episodes: 50
gamma: 0.99
learning_rate: 0.01
use_baseline: true
grad_clip: 1.0

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results
