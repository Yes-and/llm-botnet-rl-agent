# REINFORCE training run — scenario-003 (mixed-target: 5 exploitable, 5 hardened, 2 dead)
# Model: MiniMaxAI/MiniMax-M2.5, conditioned action head
# Changes from -003: entropy_coeff=0.01 (exploration), lr 0.01→0.001 (slower updates),
#                    gamma 0.99→0.95, context_window 5→2
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 100
model: MiniMaxAI/MiniMax-M2.5
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 2

# --- Seeds ---
seed_python: 0
seed_torch: 0

# --- Policy ---
hidden_dim: 128
num_layers: 1
conditioned_action_head: true

# --- Training ---
num_episodes: 30
gamma: 0.95
learning_rate: 0.001
use_baseline: true
grad_clip: 1.0
entropy_coeff: 0.01

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results
