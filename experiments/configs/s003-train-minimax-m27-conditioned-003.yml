# REINFORCE training run — scenario-003 (mixed-target: 5 exploitable, 5 hardened, 2 dead)
# Model: MiniMaxAI/MiniMax-M2.7, conditioned action head + duration head
# Purpose: verify ADR 012's two fixes behave as expected — NOT a convergence run.
#   1. shell_access now masks the whole host slot in the host head (previously only
#      CONNECT_* was masked in the action head) — a compromised host's IP should never
#      appear as the target in a later step within the same episode.
#   2. reward is now gated on parsed.exploit.host == the RL-selected host — grep
#      train.log for "exploit on .* ignored" to see how often this actually fires.
# Deliberately short (50 steps x 30 episodes, ~19% of -002's 8000 steps) since neither
# fix needs a long run to show up: both are structural/deterministic, not learned. Every
# other hyperparameter copied unchanged from -002 (lr=0.003, gamma=0.95, grad_clip=1.0,
# entropy_coeff=0.01, duration_options, context_window=5) so the fixes are the only
# variable — same isolation approach -002 used for learning_rate.
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 50
model: MiniMaxAI/MiniMax-M2.7
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 5

# --- Seeds ---
seed_python: 0
seed_torch: 0

# --- Policy ---
hidden_dim: 128
num_layers: 1
conditioned_action_head: true
duration_options: [1, 2, 3, 5]

# --- Training ---
num_episodes: 30
gamma: 0.95
learning_rate: 0.003
use_baseline: true
grad_clip: 1.0
entropy_coeff: 0.01

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results
