# REINFORCE training run — scenario-003 (mixed-target: 5 exploitable, 5 hardened, 2 dead)
# Model: MiniMaxAI/MiniMax-M2.7, conditioned action head + duration head
# Cheap directional check, not a confirmatory run: does ADR 013's hostname anonymization
# (sandbox/compose/scenario-003.yml — hostname/container_name/service-key no longer reveal
# service type or hardened-status via nmap rDNS) change anything, on a budget we can afford
# to treat as a "probably tells us nothing conclusive" bet. Every hyperparameter unchanged
# from -004 (lr=0.003, gamma=0.95, grad_clip=1.0, entropy_coeff=0.01, duration_options,
# context_window=5, max_steps=100) — hostname anonymization is the only variable that moved.
# num_episodes 50->30: deliberately scaled down from a full -002-budget (80) comparison —
# not expecting entropy convergence at this size (per -002's own precedent, entropy didn't
# start dropping until ep30-40), only checking for the cheaper signals that don't need
# convergence: whether the model's own scan narration still reveals hardened-status (it
# shouldn't, checkable from episode 1), and within-episode repeat-visit behavior on a single
# host, compared qualitatively against -004's first 30 episodes. See project memory
# (project_rl_redesign_single_host_episode.md, project_m27_command_capability_case_study.md)
# for the fuller reasoning chain this sits at the end of.
# Commit this file before running. Results are gitignored.

# --- Environment ---
container_name: s003_attacker
max_steps: 100
model: MiniMaxAI/MiniMax-M2.7
timeout: 60
api_timeout: 60
max_output_chars: 4000
dry_run: false
context_window: 5

# --- Seeds ---
seed_python: 0
seed_torch: 0

# --- Policy ---
hidden_dim: 128
num_layers: 1
conditioned_action_head: true
duration_options: [1, 2, 3, 5]

# --- Training ---
num_episodes: 30
gamma: 0.95
learning_rate: 0.003
use_baseline: true
grad_clip: 1.0
entropy_coeff: 0.01

# --- Checkpoints ---
save_every: 10
results_dir: experiments/results
