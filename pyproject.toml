[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-botnet-rl-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "docker",
    "torch",
    "numpy",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
analysis = [
    "matplotlib",
    "pandas",
    "seaborn",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "rl*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
