name: scenario-002

services:
  attacker:
    build: ../images/attacker
    container_name: s002_attacker
    networks:
      - s002_net
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /home/agent
    stdin_open: true
    tty: true

  host01:  # SSH, weak creds
    build: ../images/target
    container_name: s002_host01
    hostname: host01
    networks:
      - s002_net

  host02:  # Telnet, weak creds
    build: ../images/telnet-target
    container_name: s002_host02
    hostname: host02
    networks:
      - s002_net

  host03:  # FTP, anonymous login
    build: ../images/ftp-target
    container_name: s002_host03
    hostname: host03
    networks:
      - s002_net

  host04:  # Redis, no auth
    image: redis:latest
    container_name: s002_host04
    hostname: host04
    command: redis-server --protected-mode no
    networks:
      - s002_net

  host05:  # MongoDB, no auth
    image: mongo:4.4
    container_name: s002_host05
    hostname: host05
    networks:
      - s002_net

networks:
  s002_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
